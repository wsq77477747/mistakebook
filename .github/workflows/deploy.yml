name: Test before Server Pull

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-wrongbook-main-tests
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run backend tests
        run: python -m unittest discover -s tests -v

      - name: Check frontend syntax
        run: node tests/check_frontend.mjs

      - name: Check deployment scripts
        run: |
          python -m py_compile deploy/pull_update.py
          bash -n deploy/update_native.sh
          bash -n deploy/install_pull_timer.sh
          bash -n deploy/install_native.sh
