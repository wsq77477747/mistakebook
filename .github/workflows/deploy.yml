name: Test before Server Pull

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-wrongbook-main-tests
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without external actions
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD

      - name: Show bundled runtimes
        run: |
          python3 --version
          node --version

      - name: Run backend tests
        run: python3 -m unittest discover -s tests -v

      - name: Check frontend syntax
        run: node tests/check_frontend.mjs

      - name: Check deployment scripts
        run: |
          python3 -m py_compile deploy/pull_update.py deploy/apply_private_config.py
          bash -n deploy/update_native.sh
          bash -n deploy/install_pull_timer.sh
          bash -n deploy/install_native.sh

      - name: Guard private config out of the repository
        run: |
          if git ls-files --error-unmatch config/ai_config.json config/email_config.json >/dev/null 2>&1; then
            echo "::error::私密配置文件被提交进仓库，请立即从历史中移除并轮换密钥" && exit 1
          fi
          echo "OK: ai_config.json / email_config.json 未入库"
